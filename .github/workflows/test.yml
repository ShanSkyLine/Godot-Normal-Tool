name: Normal engine checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/surface.test.js && node tests/generation.test.js && node tests/godot.test.js
      - run: python3 tests/zip.test.py
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.test.cjs
      - name: Install Godot 4.5.1
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
      - name: Validate real Godot import, scene, animation and relocation
        run: python3 tests/godot-runtime.test.py /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
